[opcache]
; Fix for slow dev server on Windows bind mounts (Docker Desktop + artisan serve).
; The app runs under `artisan serve` (CLI SAPI), so opcache must be enabled for
; the CLI or every request re-reads/recompiles the whole framework (~1500 files)
; through the ~90ms/file Windows filesystem bridge (7-17s TTFB).
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=60
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1